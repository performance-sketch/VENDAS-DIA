name: E-mail resumo do dia anterior

on:
  schedule:
    # 08:00 no Rio (UTC-3); o GitHub pode atrasar alguns minutos
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar reservas na Rezdy
        run: python scripts/sync.py
        env:
          REZDY_API_KEY: ${{ secrets.REZDY_API_KEY }}
      - name: Enviar e-mail com o resumo de ontem
        run: python scripts/email_resumo.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
