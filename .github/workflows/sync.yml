name: Sync Rezdy

on:
  schedule:
    # a cada 15 min, das 07h às 23h (Rio = UTC-3)
    - cron: '*/15 10-23,0-2 * * *'
  workflow_dispatch:

concurrency:
  group: sync-rezdy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - name: Buscar reservas na Rezdy (valores criptografados)
        run: python scripts/sync.py
        env:
          REZDY_API_KEY: ${{ secrets.REZDY_API_KEY }}
          SENHA_PAINEL: ${{ secrets.SENHA_PAINEL }}
      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados.js
          git diff --cached --quiet || (git commit -m "dados Rezdy $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')" && git pull --rebase && git push)
